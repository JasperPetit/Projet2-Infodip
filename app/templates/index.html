<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infodip-Matrice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <style>
    #formFile::file-selector-button {
        background-color: rgba(0, 86, 179, 0.7) !important; 
        color: white !important;
    }

    #formFile:hover::file-selector-button {
        background-color: rgba(0, 86, 179, 0.9) !important; 
    }

    #analyzeButton {
        background-color: rgba(0, 86, 179, 0.7) !important; 
        border: none;
    }

    .darkmode{
        background-color: #12121298 !important;
        color: #ffffff !important;
    }
  </style>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="/static/Infodip-logo.png" width="100" height="50" alt="Logo Infodip"/>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Matrice Conformité</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">ChatBot</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                
                <h1 id="title" class="mb-4">Génération de Matrice de Conformité</h1>
                
                <form action="/analyser" method="POST" enctype="multipart/form-data">
    
    <div class="input-group mb-3 shadow-sm">
      
      <input type="file" class="form-control" id="uploadFichier" name="document" accept=".pdf,.docx" style="max-width: 250px;">

      <textarea class="form-control" name="texte_manuel" placeholder="Collez votre cahier des charges ou mail ici..." aria-label="Texte de l'utilisateur" rows="2"></textarea>
      
      <button class="btn btn-primary px-4" type="submit" style="background-color: rgba(0, 86, 179, 0.9); border: none;">
        Envoyer
      </button>

    </div>

</form>



        

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">

  function myFunction() {
  var element = document.body;
  element.classList.toggle("darkmode");
} 
    </script>
</body>
</html>
