services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_projet_2
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

    shm_size: "64gb"

    restart: always
    environment:
      - OLLAMA_NUM_CTX=131072

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  app:
    build: .
    container_name: app_projet_2
    depends_on:
      - ollama
    ports:
      - "5000:5000"
    restart: always

    env_file:
      - .env

    environment:
      - OLLAMA_HOST=http://ollama:11434 

volumes: 
  ollama_storage:
